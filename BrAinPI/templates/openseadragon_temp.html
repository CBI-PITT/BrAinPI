<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Deep Zoom Viewer</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/openseadragon/2.3.1/openseadragon.min.js"></script>
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
    }

    #select_wrapper {
      background-color: #f0f0f0;
      padding: 10px;
      border-bottom: 1px solid #ccc;
    }

    #select_wrapper label {
      margin-right: 8px;
      font-size: 14px;
    }

    #select_wrapper select {
      margin-right: 14px;
      padding: 4px 8px;
      font-size: 14px;
    }

    #viewer {
      width: 100%;
      height: calc(100% - 52px);
      background-color: #e9c5c5;
      overflow: hidden;
      position: relative;
    }

    .info_badge {
      display: inline-block;
      font-size: 14px;
      color: #31708f;
      background-color: #d9edf7;
      padding: 5px 10px;
      border: 1px solid #bce8f1;
      border-radius: 4px;
      vertical-align: middle;
    }
  </style>
</head>

<body>
  <div id="select_wrapper">
    <label for="t_point_select">Time Point</label>
    <select id="t_point_select">
      {% if t_point_values %}
      {% for t in t_point_values %}
      <option value="{{ t }}" {% if loop.index0==0 %} selected {% endif %}>{{ t }}</option>
      {% endfor %}
      {% else %}
      {% for t in range(t_point) %}
      <option value="{{ t }}" {% if t==0 %} selected {% endif %}>{{ t }}</option>
      {% endfor %}
      {% endif %}
    </select>

    {% if m_point and m_point|int > 1 %}
    <label for="m_point_select">M Point</label>
    <select id="m_point_select">
      {% if m_point_values %}
      {% for m in m_point_values %}
      <option value="{{ m }}" {% if loop.index0==0 %} selected {% endif %}>{{ m }}</option>
      {% endfor %}
      {% else %}
      {% for m in range(m_point) %}
      <option value="{{ m }}" {% if m==0 %} selected {% endif %}>{{ m }}</option>
      {% endfor %}
      {% endif %}
    </select>
    {% endif %}

    <label for="channelSelect">Channel</label>
    <select id="channelSelect">
      {% for channel_idx in range(channel) %}
      <option value="{{ channel_idx }}" {% if channel_idx == 0 %}selected{% endif %}>{{ channel_idx }}</option>
      {% endfor %}
    </select>

    <label for="z_stack_select">Z Stack</label>
    <select id="z_stack_select">
      {% for z in range(z_stack) %}
      <option value="{{ z }}" {% if z==0 %} selected {% endif %}>{{ z }}</option>
      {% endfor %}
    </select>

    <div class="info_badge">
      {% if m_point and m_point|int > 1 %}
      Support axes TCZYXM
      {% else %}
      Support standard axes TCZYX
      {% endif %}
    </div>
  </div>

  <div id="viewer"></div>

  <script>
    var viewer;
    const maxLevel = parseInt('{{resolutionlevels}}');
    var timeIndexMap = {{ time_index_map | tojson }};
    var levelShapes = {{ level_shapes | tojson }};
    var levelChunks = {{ level_chunks | tojson }};

    function getTimeIndex(t_point, m_point) {
      if (timeIndexMap) {
        var key = t_point + ":" + m_point;
        if (timeIndexMap.hasOwnProperty(key)) {
          return timeIndexMap[key];
        }
      }
      return t_point;
    }

    function initializeViewer(t_point, m_point, channel, z_stack) {
      viewer = OpenSeadragon({
        id: "viewer",
        prefixUrl: "https://cdnjs.cloudflare.com/ajax/libs/openseadragon/4.1.1/images/",
        backgroundColor: "#333333",
        tileCache: true,
        showNavigator: true,
        navigatorPosition: "TOP_RIGHT",
        navigatorSizeRatio: 0.2,
        tileSources: generateTileSource(t_point, m_point, channel, z_stack)
      });
    }

    function generateTileSource(t_point, m_point, channel, z_stack) {
      var timeIndex = getTimeIndex(t_point, m_point);
      var fullLevelShape = levelShapes[0];
      return {
        height: parseInt('{{ height }}'),
        width: parseInt('{{ width }}'),
        tileWidth: parseInt('{{tileWidth}}'),
        tileHeight: parseInt('{{tileHeight}}'),
        minLevel: 0,
        maxLevel: maxLevel,
        getLevelScale: function (level) {
          var reversedLevel = maxLevel - level;
          var levelShape = levelShapes[reversedLevel];
          if (!levelShape || !fullLevelShape || !fullLevelShape.x) {
            return 1;
          }
          return levelShape.x / fullLevelShape.x;
        },
        getNumTiles: function (level) {
          var reversedLevel = maxLevel - level;
          var levelShape = levelShapes[reversedLevel];
          var levelChunk = levelChunks[reversedLevel];
          if (!levelShape || !levelChunk) {
            return new OpenSeadragon.Point(0, 0);
          }
          return new OpenSeadragon.Point(
            Math.ceil(levelShape.x / levelChunk.x),
            Math.ceil(levelShape.y / levelChunk.y)
          );
        },
        getTileWidth: function (level) {
          var reversedLevel = maxLevel - level;
          var levelChunk = levelChunks[reversedLevel];
          return levelChunk ? levelChunk.x : parseInt('{{tileWidth}}');
        },
        getTileHeight: function (level) {
          var reversedLevel = maxLevel - level;
          var levelChunk = levelChunks[reversedLevel];
          return levelChunk ? levelChunk.y : parseInt('{{tileHeight}}');
        },
        tileExists: function (level, x, y) {
          var reversedLevel = maxLevel - level;
          var levelShape = levelShapes[reversedLevel];
          var levelChunk = levelChunks[reversedLevel];
          if (!levelShape || !levelChunk) {
            return false;
          }
          var xStart = x * levelChunk.x;
          var yStart = y * levelChunk.y;
          return xStart < levelShape.x && yStart < levelShape.y;
        },
        getTileUrl: function (level, x, y) {
          var reversedLevel = maxLevel - level;
          var levelShape = levelShapes[reversedLevel];
          var levelChunk = levelChunks[reversedLevel];
          var yStart = y * levelChunk.y;
          var xStart = x * levelChunk.x;
          var yEnd = Math.min(yStart + levelChunk.y, levelShape.y);
          var xEnd = Math.min(xStart + levelChunk.x, levelShape.x);
          return "{{host}}/{{parent_url}}/" +
            reversedLevel + "/" + timeIndex + "/" + channel + "/" + z_stack +
            "_" + yStart + "-" + yEnd +
            "_" + xStart + "-" + xEnd;
        }
      };
    }

    function updateViewer(selected_t_point, selected_m_point, selectedChannel, selected_z_stack) {
      viewer.open(generateTileSource(selected_t_point, selected_m_point, selectedChannel, selected_z_stack));
    }

    var defaultTPoint = {{ (t_point_values[0] if t_point_values else 0) | tojson }};
    var defaultMPoint = {{ (m_point_values[0] if m_point_values else 0) | tojson }};
    initializeViewer(defaultTPoint, defaultMPoint, 0, 0);

    document.addEventListener("DOMContentLoaded", function () {
      function getSelectedMPoint() {
        var mSelect = document.getElementById("m_point_select");
        if (!mSelect) {
          return 0;
        }
        return parseInt(mSelect.value);
      }

      var channelSelect = document.getElementById("channelSelect");
      if (channelSelect) {
        channelSelect.addEventListener("change", function (event) {
          var selectedChannel = parseInt(event.target.value);
          var selectedZStack = parseInt(document.getElementById("z_stack_select").value);
          var selectedTpoint = parseInt(document.getElementById("t_point_select").value);
          var selectedMpoint = getSelectedMPoint();
          updateViewer(selectedTpoint, selectedMpoint, selectedChannel, selectedZStack);
        });
      }

      var zStackSelect = document.getElementById("z_stack_select");
      if (zStackSelect) {
        zStackSelect.addEventListener("change", function (event) {
          var selectedTpoint = parseInt(document.getElementById("t_point_select").value);
          var selectedZStack = parseInt(event.target.value);
          var selectedChannel = parseInt(document.getElementById("channelSelect").value);
          var selectedMpoint = getSelectedMPoint();
          updateViewer(selectedTpoint, selectedMpoint, selectedChannel, selectedZStack);
        });
      }

      var tPointSelect = document.getElementById("t_point_select");
      if (tPointSelect) {
        tPointSelect.addEventListener("change", function (event) {
          var selectedTpoint = parseInt(event.target.value);
          var selectedZStack = parseInt(document.getElementById("z_stack_select").value);
          var selectedChannel = parseInt(document.getElementById("channelSelect").value);
          var selectedMpoint = getSelectedMPoint();
          updateViewer(selectedTpoint, selectedMpoint, selectedChannel, selectedZStack);
        });
      }

      var mPointSelect = document.getElementById("m_point_select");
      if (mPointSelect) {
        mPointSelect.addEventListener("change", function (event) {
          var selectedMpoint = parseInt(event.target.value);
          var selectedTpoint = parseInt(document.getElementById("t_point_select").value);
          var selectedZStack = parseInt(document.getElementById("z_stack_select").value);
          var selectedChannel = parseInt(document.getElementById("channelSelect").value);
          updateViewer(selectedTpoint, selectedMpoint, selectedChannel, selectedZStack);
        });
      }
    });
  </script>
</body>

</html>
