<!doctype html>
<html lang="en">
<head>
    {% if gtag %}
    <script async src="https://www.googletagmanager.com/gtag/js?id={{ gtag }}"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', '{{ gtag }}');
    </script>
    {% endif %}
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0b2536">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/brainpi_icon_v3.png') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='images/brainpi_icon_v3.png') }}">
    <title>Unable to open dataset · BrAinPI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/app-theme.css') }}">
</head>
<body class="status-shell status-shell-error">
    <div class="status-brand" aria-label="BrAinPI"><img class="brand-icon" src="{{ url_for('static', filename='images/brainpi_icon_v3.png') }}" alt="" aria-hidden="true"><strong>BrAinPI</strong></div>

    <main class="status-card status-card-with-image error-card" role="alert">
        <div class="status-art error-art">
            <img src="{{ url_for('static', filename='images/file_exception.png') }}" alt="Illustration of a file that could not be opened">
            <span>Dataset exception</span>
        </div>
        <div class="status-content">
            <p class="status-kicker error-kicker">Viewer unavailable</p>
            <h1>Unable to open this dataset.</h1>
            <p class="status-copy">BrAinPI encountered a problem while preparing the file for the viewer.</p>
            <div class="error-detail"><span>Error detail</span><strong>{{ exception }}</strong></div>
        </div>
    </main>

    <p class="status-footnote">The error has been recorded in the application log.</p>
</body>
</html>
