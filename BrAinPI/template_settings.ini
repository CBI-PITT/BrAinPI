# BrAinPI configuration template. Copy or rename this file to settings.ini.
# Most settings are read when each application worker starts; restart workers
# after editing unless the relevant endpoint explicitly reloads configuration.

[app]
# Browser-reachable public base URL used to construct NG, OSD, OME-Zarr,
# curated-dataset, path_to_html_options, and tokenized links.
# This is not Flask/Gunicorn's bind address. Use the real scheme/domain/IP and
# port seen by clients. Local development may use http://localhost:5001/
url = https://localhost:5001/

# Branding displayed on the landing, login, and browser pages.
name = BrAinPI
description = The Brain API
motto = An application for browsing and visualizing microscopy data over the internet

# Path to the logo relative to static_location; for example,
# images/my_logo.png resolves to <static_location>/images/my_logo.png.
logo = images/cbi_logo.png

# Logging profile. Replace the value with exactly one of:
# development: TRACE-and-higher messages to stderr.
# production: SUCCESS-and-higher messages to stderr and rotating logfile.log.
# Other text does not select either configured logging sink.
log_engine = development or production

# Flask debug configuration. This does not select the bind address or make
# Gunicorn reload source/configuration changes.
debug = False

# Flask template and static directories. Relative paths are resolved from the
# process working directory (normally BrAinPI/ when launched as documented).
templates_location = templates
static_location = static

[browser]
# Text displayed by the filesystem-browser page.
title = BrAinPI
header = BrAinPI
footer = See a Slice of Brain

# Enable the landing/login/filesystem-browser workflow. False disables the
# interactive browser/auth routes, but does not by itself disable data APIs.
browser_active = True

# Files larger than this many GB have their Download option suppressed by the
# browser. This is a UI/link decision, not a hard limit on direct HTTP access.
max_dl_file_size_GB = 10

[dir_anon]
###################################################################
# Dataset roots exposed to anonymous and authenticated users.
# Each key is the public path alias; each value is a local directory or a
# supported remote/S3 root. Add any number of uniquely named entries.
# Remove/comment all entries to expose no anonymous roots in the browser.
# These mappings are also used to translate endpoint URLs into data paths.
#
# Example:
# everyone_sees_me = /everyone/has/access/to/this/dir
# HTTP:
# https://my.BrAinPI.com/browser/everyone_sees_me
###################################################################

# Uncomment and change the line below:
#everyone_sees_me = /everyone/has/access/to/this/dir

[dir_auth]
####################################################################
# Additional dataset roots shown after successful authentication.
# Each key is a public path alias and each value is the backing local or
# supported remote/S3 root. Whether users are restricted to a matching first
# child directory is controlled by restrict_paths_to_matched_username below.
# Group matches are read from groups.ini; membership in "all" bypasses that
# child-directory restriction.
#
# Example:
# only_authenticated_users_see_me = /only/authenticated/users/have/access/to/this/dir
# HTTP:
# https://my.BrAinPI.com/browser/only_authenticated_users_see_me
####################################################################

# Uncomment and change the line below:
#some_people_see_me = /only/authenticated/users/have/access/to/this/dir

[curated_datasets]
# Optional named collections. Each value points to a text file containing one
# BrAinPI-compatible dataset path per line. The collection endpoint turns each
# line into path_to_html_options links; it does not verify dataset existence at
# collection-read time. Paths must be under a configured dir_anon or dir_auth
# mapping to produce usable BrAinPI URLs.
# Example: my_fav_datasets = /location/to/my/txt/file.txt

[file_types]
# Optional suffix allowlist for regular files displayed by the filesystem browser.
# The current implementation applies this list only when
# [auth] restrict_files_to_listed_file_types = True AND an authenticated,
# non-"all" user is browsing a protected [dir_auth] directory.
# Files in [dir_anon] directories and files viewed by users in the "all" group
# are not filtered by this list. Supported directory-backed datasets such as
# .ome.zarr are also classified separately by the viewer support code.
# This is a browser-listing filter, not an access-control rule: hiding a file
# here does not by itself block a known direct download, NG, OSD, or OME-Zarr URL.
# When the filter applies, an empty [file_types] section displays no regular
# files. Set restrict_files_to_listed_file_types = False to display all files.
# Each key is only a descriptive label; its value is matched as a
# case-insensitive filename suffix, so compound suffixes such as .ome.tiff work.

# Examples (uncomment or add your own):
#imaris = .ims
#nikon = .nd2
#tiff = .tiff
#tif = .tif


[auth]
#######################################################################################
# Accept ANY username/password as an authenticated login. Testing only: keep
# False in production. Authentication routes exist only when browser_active is
# True, and secure session cookies require HTTPS in normal browser use.
#######################################################################################
bypass_auth = False

# For protected dir_auth roots, show only the first-level directory matching
# the username or one of the user's groups from groups.ini. Users assigned to
# the "all" group can browse the full protected root. False lets every
# authenticated user browse every configured dir_auth root.
restrict_paths_to_matched_username = True
# Apply [file_types] to eligible protected-directory browser listings as
# described above. This setting does not filter anonymous directories and is
# not an endpoint authorization mechanism.
restrict_files_to_listed_file_types = True

#########################################################################################
# Secret used for Flask sessions and signed URL tokens. Replace it with a long,
# random secret; keep it identical across workers and out of source control.
# Changing it invalidates existing sessions and tokens.
#########################################################################################
secret_key = this is my secret key

########################################################
# Semicolon-separated Flask-Limiter rules applied per client IP to login.
# The current memory backend is shared by threads inside one worker, but not
# across Gunicorn workers; production-wide limits require a shared backend.
########################################################
login_limit = 100/day;60/hour;10/minute

#########################################
# LDAP/Windows-domain login settings, used when bypass_auth is False.
# domain_server is passed to ldap://<server>:<port>; domain_name is used to
# qualify the submitted username.
#########################################
#domain_server = IP or domain name
#domain_port = 389
#domain_name = mydomain

[pyramids_images_location]
# Parent location recursively scanned at worker startup to rediscover generated
# TIFF, NIfTI, and JP2 pyramid outputs. Put the loader stores below this path.
# Use an absolute path: tilde expansion is not consistent in all scan/load paths.
location = ~/pyramid_images_store/

# Legacy/reserved template option. Current code identifies generated outputs
# using each loader section's extension_type and does not read this value.
extension_type = ['.ome.zarr','.nii.zarr']

[tif_loader]
# Non-pyramidal TIFF inputs are converted on demand to pyramidal OME-TIFF here;
# already-pyramidal TIFF files are opened directly. Use an absolute path.
pyramids_images_store = ~/pyramid_images_store/tif/

# Maximum generated-store size. After generation, the oldest generated files
# are removed until the store is within this limit.
pyramids_images_allowed_store_size_gb = 100

# Maximum source-file size eligible for on-demand pyramid generation. This is
# not a limit on opening an already-pyramidal source.
pyramids_images_allowed_generation_size_gb = 10

# Suffix used for generated TIFF pyramid files and startup rediscovery.
extension_type = .ome.tif

[nifti_loader]
# .nii and .nii.gz inputs are converted on demand into directory-backed Zarr
# pyramids here; existing .nii.zarr inputs are opened directly. Use an absolute
# path and keep this store below pyramids_images_location for rediscovery.
pyramids_images_store = ~/pyramid_images_store/nifti/

# Generated-store quota; oldest generated outputs are removed after generation
# when necessary.
pyramids_images_allowed_store_size_gb = 100

# Maximum source-file size eligible for NIfTI-to-Zarr generation.
pyramids_images_allowed_generation_size_gb = 10

# Directory suffix used for generated NIfTI pyramids and rediscovery.
extension_type = .nii.zarr

[jp2_loader]
# JPEG 2000 inputs are converted on demand to pyramidal TIFF outputs here and
# then served through the TIFF loader. Use an absolute path and keep this store
# below pyramids_images_location for rediscovery.
pyramids_images_store = ~/pyramid_images_store/jp2/

# Generated-store quota; oldest generated outputs are removed after generation
# when necessary.
pyramids_images_allowed_store_size_gb = 100

# Maximum JP2 source-file size eligible for pyramid generation.
pyramids_images_allowed_generation_size_gb = 10

# Suffix used for generated JP2-derived TIFF pyramids and rediscovery.
extension_type = .ome.tif

[neuroglancer]
# Start BrAinPI's bundled Neuroglancer frontend process during application
# setup. This does not enable/disable the /ng data endpoint. Avoid it in a
# multi-worker production deployment; run a separately hosted frontend instead.
use_local_server = False

# Bind address/port for the bundled frontend (or neuroglancer_server.py when run
# directly).
local_port = 9999
local_ip = localhost

# Neuroglancer frontend base used in every generated viewer link, independently
# of use_local_server. Set it either to an externally hosted viewer such as
# https://neuroglancer-demo.appspot.com/ or to the real browser-reachable URL of
# your local frontend, e.g. http://localhost:9999/v/base/.
url = http://localhost:9999/v/base/
# url = https://neuroglancer-demo.appspot.com/

# Chunk layout advertised by /ng metadata:
# data (or any value other than the two names below): preserve source chunks;
# isotropic: advertise [chunk_depth, chunk_depth, chunk_depth];
# anisotropic: advertise three SliceView layouts, preserving the two source
# in-plane dimensions and using chunk_depth on the orthogonal dimension.
# chunk_depth is in voxels and is ignored for data/source chunking.
chunk_type = anisotropic
chunk_depth = 1

[disk_cache]
######################################
# Shared on-disk response/chunk cache. Windows reads location_win; all other
# platforms read location_unix. Leave the selected option valueless to disable
# caching. Otherwise provide an absolute, writable directory. Multiple workers
# may share this diskcache FanoutCache.
######################################
location_win
location_unix

# Total cache size limit across shards, in GB.
cacheSizeGB = 100

# diskcache eviction policy name (for example least-recently-used).
evictionPolicy = least-recently-used

# Number of FanoutCache shards used to reduce writer contention.
shards = 16

# Seconds to wait to acquire an underlying cache/database lock.
timeout = 0.010

[GA4]
# Optional Google Analytics 4 measurement ID (G-XXXXXXXXXX), injected into
# rendered HTML templates. Leave this option valueless to disable analytics.
gtag

[rsa]
# Optional directory in which tokenized_urls creates/loads its RSA key files.
# Leave valueless (or omit the section/option) to skip RSA initialization. The
# current active token path uses secret_key/JWT; RSA encryption calls are
# presently disabled, but the implementation is retained for future use.
key_location

# RSA key size used if key files must be generated. Keep one shared key location
# across workers. Use a modern deployment-appropriate size (normally >= 2048).
bit = 256
