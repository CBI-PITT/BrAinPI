# For more information about tox, see https://tox.readthedocs.io/en/latest/
[tox]
envlist = py312-{linux,macos,windows}

[gh-actions]
python =
    3.12: py312

[gh-actions:env]
PLATFORM =
    ubuntu-latest: linux
    macos-latest: macos
    windows-latest: windows

[testenv]
platform = 
    macos: darwin
    linux: linux
    windows: win32
passenv = 
    CI
    GITHUB_ACTIONS
    DISPLAY
    XAUTHORITY
    NUMPY_EXPERIMENTAL_ARRAY_FUNCTION
    PYVISTA_OFF_SCREEN
commands = python -I -c "import BrAinPI; print('BrAinPI import successful')"
