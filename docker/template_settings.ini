# Docker configuration template. Copy this file to docker/settings.ini before
# starting Compose. Paths in this file are container paths. Most settings are
# read when workers start, so recreate/restart the service after editing.

[app]
# Browser-visible BrAinPI base URL used to construct application links. In the
# supplied Compose deployment BRAINPI_PUBLIC_URL overrides this value. This is
# not the Gunicorn bind address.
url = http://localhost:5001/

# Branding text displayed by the web interface.
name = BrAinPI
description = The Brain API
motto = Browse and visualize microscopy data

# Logo path relative to static_location.
logo = images/cbi_logo.png

# Logging profile: development enables verbose console logging; production
# keeps normal production-level console logging. Compose captures stdout.
log_engine = production

# Flask debug flag. Keep False for Gunicorn/production-style deployments.
debug = False

# Application template/static directories inside the image. Normally unchanged.
templates_location = templates
static_location = static

[browser]
# Text shown by the filesystem-browser interface.
title = BrAinPI
header = BrAinPI
footer = See a Slice of Brain

# Enable browser, login, and filesystem navigation pages. Data API registration
# is controlled separately by the application.
browser_active = True

# Hide the browser Download action for files larger than this many GB. This is
# a UI limit, not authorization and not a hard direct-download limit.
max_dl_file_size_GB = 10

[dir_anon]
# Dataset paths use the container filesystem. The host directory configured by
# BRAINPI_DATA_DIR is mounted read-only at /data by Compose.
# Uncomment and customize an alias only after verifying it is safe to expose
# without authentication.
# public = /data/Public

[dir_auth]
# Additional aliases available only after successful authentication.
# Uncomment and customize after configuring LDAP and groups.ini.
# protected = /data/Protected

[curated_datasets]
# Optional named collections. Each value is a container-visible text file with
# one configured BrAinPI dataset path per line.
# example_collection = /data/collections/example.txt

[file_types]
# Optional case-insensitive filename-suffix allowlist used for eligible
# authenticated browser listings when restrict_files_to_listed_file_types is
# True. It is not an endpoint authorization rule.
# tiff = .tif
# ome_tiff = .ome.tiff
# imaris = .ims

[auth]
# Testing-only authentication bypass. Keep False in real deployments.
bypass_auth = False

# Under protected roots, restrict non-[all] users to first-level directories
# matching their username or a group listed in docker/groups.ini.
restrict_paths_to_matched_username = True

# Apply [file_types] to eligible protected browser listings.
restrict_files_to_listed_file_types = True

# Overridden by the required BRAINPI_SECRET_KEY environment variable.
# Changing the effective value invalidates existing sessions and signed URLs.
secret_key = container-placeholder

# Semicolon-separated Flask-Limiter rules applied to login attempts per IP.
login_limit = 100/day;60/hour;10/minute

# Leave these blank in the committed template. The application still starts and
# anonymous paths remain available, but LDAP login is disabled until both the
# server and domain are configured in a deployment-specific settings file.
# domain_server is the LDAP host, domain_port is its TCP port, and domain_name
# qualifies submitted usernames.
domain_server =
domain_port = 389
domain_name =

[tif_loader]
# Container directory for generated TIFF pyramids. Compose maps it to the
# persistent brainpi-pyramids named volume.
pyramids_images_store = /var/lib/brainpi/pyramids/tif
# Generated pyramids are retained until an administrator removes them while the
# BrainPI service is stopped. This setting limits only an individual source file.
pyramids_images_allowed_generation_size_gb = 10
# Suffix used for deterministic generated TIFF artifact paths.
extension_type = .ome.tif

[nifti_loader]
# Container directory for generated NIfTI-derived Zarr pyramids.
pyramids_images_store = /var/lib/brainpi/pyramids/nifti
# Maximum individual .nii/.nii.gz source size eligible for generation; this is
# not a total storage quota.
pyramids_images_allowed_generation_size_gb = 10
# Directory suffix used for generated NIfTI artifacts.
extension_type = .nii.zarr

[jp2_loader]
# Container directory for generated JP2-derived TIFF pyramids.
pyramids_images_store = /var/lib/brainpi/pyramids/jp2
# Maximum individual JP2 source size eligible for generation; this is not a
# total storage quota.
pyramids_images_allowed_generation_size_gb = 10
# Suffix used for generated JP2-derived TIFF artifacts.
extension_type = .ome.tif

[neuroglancer]
# Container-internal bind address and port for neuroglancer_server.py. These are
# not browser-facing values. Keep 0.0.0.0:9999 with the supplied Compose file;
# BRAINPI_NG_PORT optionally changes only the published host port. These options
# configure the standalone Neuroglancer service that Compose starts by default.
local_ip = 0.0.0.0
local_port = 9999

# This must be a plain browser-reachable URL, not Markdown link syntax. For
# access from another computer, replace localhost and the port with the
# server's browser-reachable hostname/port. To use Google's hosted viewer
# instead of the local Compose service, select the commented URL below.
url = http://localhost:9999/v/base/
# url = https://neuroglancer-demo.appspot.com/

# Chunk layout advertised by /ng metadata. "data" preserves source chunks;
# "isotropic" advertises equal XYZ depths; "anisotropic" advertises SliceView
# layouts. chunk_depth is measured in voxels and ignored for "data".
chunk_type = anisotropic
chunk_depth = 1

[disk_cache]
# Windows and non-Windows cache locations. Docker is Linux and therefore uses
# location_unix, which Compose maps to the persistent brainpi-cache volume.
# Leave the selected value empty to disable the disk cache.
location_win
location_unix = /var/cache/brainpi

# Total disk-cache size limit in GB. This does not limit pyramid storage.
cacheSizeGB = 100

# diskcache eviction policy, number of writer-contention shards, and lock wait
# timeout in seconds.
evictionPolicy = least-recently-used
shards = 16
timeout = 0.010

[GA4]
# Optional Google Analytics 4 measurement ID (G-XXXXXXXXXX). Leave empty to
# disable analytics.
gtag

[rsa]
# Optional container directory for legacy RSA key generation/loading. Leave
# empty to skip RSA initialization. Active sessions/tokens use secret_key/JWT.
key_location

# RSA key size if keys are generated. 2048 bits is the supplied minimum.
bit = 2048
