# BrAinPI authorization-group template. Copy this file to docker/groups.ini.
# Enter one username per line without "=". Group names correspond to
# first-level directory names below protected [dir_auth] roots when
# restrict_paths_to_matched_username is enabled.

[all]
# Members listed here may browse every configured protected root rather than
# only username/group-matched first-level directories. Leave empty by default.
# administrator_username

# Add additional sections as needed. A user may belong to multiple groups.
# Example:
#
# [research_team]
# alice
# bob
